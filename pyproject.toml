[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rala-formula-lab"
version = "0.1.0"
description = "Reproducible experiments for rank-augmented and hybrid linear attention"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Suleman Ahmed"}]
dependencies = [
  "streamlit>=1.36",
  "torch>=2.3",
  "torchvision>=0.18",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "pytest>=8.2",
  "python-docx>=1.1",
]

[tool.setuptools.packages.find]
include = ["rala_lab*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
